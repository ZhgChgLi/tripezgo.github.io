name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 純靜態網站，沒有建置步驟——repo 根目錄就是要發布的內容。
      # 只做一件事：把每個 HTML 檔的內部連結拿出來對一次，斷掉就讓 build 紅。
      - name: Check internal links
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r page; do
            grep -oE '(href|src)="/[^"#?]*"' "$page" \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | sort -u \
              | while IFS= read -r link; do
                  target=".${link}"
                  [ "${link: -1}" = "/" ] && target=".${link}index.html"
                  if [ ! -e "$target" ]; then
                    echo "::error file=${page}::broken internal link ${link}"
                    exit 1
                  fi
                done || fail=1
          done < <(find . -name '*.html' -not -path './.git/*')
          [ "$fail" -eq 0 ]

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
