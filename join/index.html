<!DOCTYPE html>

<header class="site-header">

    <a class="brand" href="/" aria-label="TripEZGo 首頁">
      <span class="m m-mark" role="img" aria-hidden="true"></span>
      <span class="m m-word" role="img" aria-hidden="true"></span>
    </a>
    <nav class="site-nav" aria-label="主要導覽">
      <a class="lang" href="/en/" hreflang="en" lang="en">EN</a>
      <a class="lang" href="/ja/" hreflang="ja" lang="ja">日本語</a>
    </nav>

<main class="notfound">
  <div class="wrap">
    <p class="eyebrow">旅程邀請</p>

    <p class="lede" style="margin-inline:auto" id="lede">

    </p>
    <a class="btn btn-primary" id="get" href="/" hidden>取得 TripEZGo</a>
    <p class="lede" style="margin-inline:auto;margin-top:16px;font-size:var(--text-sm)" id="getnote" hidden></p>
    <a class="btn btn-ghost" id="go" href="/" hidden>在 TripEZGo 中打開</a>
    <p class="lede" style="margin-inline:auto;margin-top:24px;font-size:var(--text-sm)" id="foot">
      還沒有 TripEZGo？<a href="/" id="learn">看看它是什麼</a>
    </p>
  </div>

<footer class="site-footer">

        <a href="mailto:zhgchgli@gmail.com">聯絡我們</a>
      </nav>
    </div>
  </div>
</footer>

<script>
/* 這一頁只做一件事：把 # 片段裡那條 iCloud 分享網址交回給使用者。
 *
 * **為什麼放在 # 裡**：片段不會送到伺服器，所以那條邀請網址不會出現在 GitHub Pages 的
 * 存取記錄裡。它是一把鑰匙——拿到的人就進得去，沒有理由留在別人的日誌上。
 *
 * **為什麼不自動跳轉**：裝了 App 的 iPhone 根本不會走到這一頁（Universal Link 會先把它
 * 攔走）。走到這裡的人是「沒裝 App」或「在電腦上」，那時候把他丟去 icloud.com 只會看到
 * 一頁要他裝 App 的畫面——不如在這裡講清楚，再讓他自己按。
 */
(function () {
  var head = document.getElementById('head');
  var lede = document.getElementById('lede');
  var go = document.getElementById('go');
  var get = document.getElementById('get');
  var getNote = document.getElementById('getnote');
  var learn = document.getElementById('learn');

  /* 邀請連結會傳給誰事先不知道——同行的人可能讀日文或英文。這一頁沒有語系網址
   * （連結本身是 /join/#...），所以照瀏覽器的語言換一套字串就好。 */
  var STRINGS = {
    'zh': {
      lang: 'zh-Hant-TW',
      title: '加入這趟旅程 — TripEZGo',
      eyebrow: '旅程邀請',
      head: '正在打開這趟旅程⋯',
      lede: '裝了 TripEZGo 的 iPhone 會直接打開 App。沒有跳過去的話，用底下這顆。',
      go: '在 TripEZGo 中打開',
      learn: '看看它是什麼',
      learnPrefix: '還沒有 TripEZGo？',
      home: '/',
      badHead: '這條邀請連結不完整',
      badLede: '請對方重新複製一次連結——網址最後那一段（# 之後）也要一起帶上。',
      get: '取得 TripEZGo',
      getNote: '按下去會先把這條邀請連結存進剪貼簿。裝好 TripEZGo、第一次打開時，它會問你要不要加入這趟旅程。',
      copiedHead: '邀請連結已經存起來了',
      copiedLede: '接著去取得 TripEZGo。第一次打開 App 時，它會問你要不要加入這趟旅程。',
      copiedGo: '前往下載'
    },
    'ja': {
      lang: 'ja',
      title: 'この旅程に参加 — TripEZGo',
      eyebrow: '旅程への招待',
      head: 'この旅程を開いています⋯',
      lede: 'TripEZGo が入っている iPhone なら、そのままアプリが開きます。開かないときは下のボタンから。',
      go: 'TripEZGo で開く',
      learn: 'どんなアプリか見る',
      learnPrefix: 'TripEZGo をまだお持ちでない方は',
      home: '/ja/',
      badHead: 'この招待リンクは不完全です',
      badLede: 'リンクをもう一度コピーしてもらってください。URL の最後の部分（# のあと）も必要です。',
      get: 'TripEZGo を入手',
      getNote: '押すと、この招待リンクをクリップボードに保存します。TripEZGo をインストールして最初に開いたときに、この旅程に参加するか尋ねます。',
      copiedHead: '招待リンクを保存しました',
      copiedLede: '続けて TripEZGo を入手してください。最初に開いたときに、この旅程に参加するか尋ねます。',
      copiedGo: 'ダウンロードへ'
    },
    'en': {
      lang: 'en',
      title: 'Join this trip — TripEZGo',
      eyebrow: 'Trip invitation',
      head: 'Opening this trip…',
      lede: 'An iPhone with TripEZGo installed opens the app straight away. If it didn’t, use the button below.',
      go: 'Open in TripEZGo',
      learn: 'see what it is',
      learnPrefix: 'Don’t have TripEZGo yet? ',
      home: '/en/',
      badHead: 'This invite link is incomplete',
      badLede: 'Ask them to copy the link again — the last part of the address (after the #) has to come with it.',
      get: 'Get TripEZGo',
      getNote: 'This saves the invite link to your clipboard first. Install TripEZGo, and the first time you open it, it will offer to join you to this trip.',
      copiedHead: 'Invite link saved',
      copiedLede: 'Now go and get TripEZGo. The first time you open it, it will offer to join you to this trip.',
      copiedGo: 'Go to the download'
    }
  };

  var tag = (navigator.language || 'zh').toLowerCase();
  var t = STRINGS[tag.indexOf('ja') === 0 ? 'ja' : (tag.indexOf('zh') === 0 ? 'zh' : 'en')];

  /* 去哪裡拿 App。**現在還沒上架**（首頁那顆鈕寫的是「即將於 App Store 上架」），所以先送他
   * 回首頁。上架那天把這一行換成那條 https://apps.apple.com/… 網址就好，這一頁其他地方
   * 都不必動——剪貼簿那一半跟去哪裡下載沒有關係。 */
  var STORE = t.home;

  document.documentElement.lang = t.lang;
  document.title = t.title;
  document.querySelector('.eyebrow').textContent = t.eyebrow;
  head.textContent = t.head;
  lede.textContent = t.lede;
  go.textContent = t.go;
  get.textContent = t.get;
  getNote.textContent = t.getNote;
  learn.textContent = t.learn;
  learn.href = t.home;
  learn.parentNode.firstChild.nodeValue = t.learnPrefix;

  function decode(fragment) {
    /* base64url → 原本那條網址。舊的 `#s=` 與純片段兩種都收。 */
    var raw = fragment.replace(/^#/, '');
    if (raw.indexOf('s=') === 0) raw = raw.slice(2);
    if (!raw) return '';
    var padded = raw.replace(/-/g, '+').replace(/_/g, '/');
    while (padded.length % 4) padded += '=';
    try {
      var text = decodeURIComponent(escape(atob(padded)));
      /* 只接受 iCloud 的分享網址——這一頁不是一個誰都可以用的轉址器。 */
      return /^https:\/\/(www\.)?icloud\.com\//.test(text) ? text : '';
    } catch (err) {
      return '';
    }
  }

  var url = decode(location.hash);
  if (!url) {
    head.textContent = t.badHead;
    lede.textContent = t.badLede;
    return;
  }
  go.href = url;
  go.hidden = false;

  /* ─── 沒裝 App 的那一半：把邀請連結存進剪貼簿 ─────────────────────────────
   *
   * 走到這一頁的 iPhone 就是**沒裝 App 的那一支**——裝了的話 Universal Link 早就把它攔走了。
   * 而他接下來要做的事（去下載）會把這條連結丟掉：App Store 不會把「他是被誰邀請的」帶進
   * 第一次啟動。所以在他按下下載的那一刻，把**整條邀請連結**存進剪貼簿；App 第一次打開時
   * 會問一句「有人邀請你加入旅程嗎」，按下貼上就接得上（deferred deep link，2026-09-06）。
   *
   * **存的是這一頁的網址，不是那條 iCloud 網址**：App 那一側認的規則只有一份
   * （`TripInviteLink.shareURL(fromPastedText:)`），而它認的就是 `tripezgo.com/join/#…`。
   *
   * **為什麼要按一下**：Safari 只在使用者的手勢裡才准寫剪貼簿——頁面自己在載入時寫是寫不
   * 進去的。而那顆鈕本來就要按。
   *
   * **為什麼第一下不順便跳走**：跳到下載頁之後沒有任何一句話說「連結已經存起來了」，而那
   * 正是他需要知道的事。第一下複製並就地把話換掉，第二下才離開。
   *
   * 複製失敗（舊瀏覽器、權限被關）就直接帶他去下載——那等於這條路沒發生過，而不是卡住。 */
  if (isApple()) {
    get.hidden = false;
    getNote.hidden = false;
    get.addEventListener('click', function (event) {
      if (get.dataset.saved === '1') return;   /* 第二下：照 href 走 */
      event.preventDefault();
      var leave = function () { location.href = STORE; };
      var saved = function () {
        get.dataset.saved = '1';
        get.href = STORE;
        get.textContent = t.copiedGo;
        head.textContent = t.copiedHead;
        lede.textContent = t.copiedLede;
        getNote.hidden = true;
        /* 「在 TripEZGo 中打開」在這一步收掉：他已經說了自己還沒有 App。 */
        go.hidden = true;
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(saved, leave);
      } else {
        leave();
      }
    });
  }

  /* iPadOS 的 Safari 預設把自己報成 Mac，所以多問一句觸控點數。 */
  function isApple() {
    var ua = navigator.userAgent;
    return /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
})();
</script>

</body>
</html>
