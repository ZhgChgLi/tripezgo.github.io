<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripEZGo</title>
<meta name="robots" content="noindex">
<script>
/* 邀請連結（https://www.tripezgo.com/join/#…）在沒裝 App 的手機上落在這裡：交給共用的跳轉頁
 * /open/（使用者要求 2026-09-26，跟「在 TripEZGo 建立這個旅程」同一頁）。
 * 交過去的是 www 那一條正式連結——那是 App 發出去的寫法，也是剪貼簿要存的那一條。
 * 這一頁本身還是要在：它是 Universal Link 認領的路徑（.well-known/apple-app-site-association）。 */
location.replace('/open/#' + encodeURIComponent('https://www.tripezgo.com/join/' + location.hash));
</script>
</head>
<body>
<noscript><p>請開啟 JavaScript，或用 iPhone 上的 TripEZGo 打開這條連結。</p></noscript>
</body>
</html>
