<script>
/* 這一頁只做一件事：把 # 片段裡那條 iCloud 分享網址交回給使用者。
 *
 * **為什麼放在 # 裡**：片段不會送到伺服器，所以那條邀請網址不會出現在 GitHub Pages 的
 * 存取記錄裡。它是一把鑰匙——拿到的人就進得去，沒有理由留在別人的日誌上。
 *
 * **為什麼不自動跳轉**：裝了 App 的 iPhone 根本不會走到這一頁（Universal Link 會先把它
 * 攔走）。走到這裡的人是「沒裝 App」或「在電腦上」，那時候把他丟去 icloud.com 只會看到
 * 一頁要他裝 App 的畫面——不如在這裡講清楚，再讓他自己按。
 */
(function () {
  var head = document.getElementById('head');
  var lede = document.getElementById('lede');
  var go = document.getElementById('go');

  function decode(fragment) {
    /* base64url → 原本那條網址。舊的 `#s=` 與純片段兩種都收。 */
    var raw = fragment.replace(/^#/, '');
    if (raw.indexOf('s=') === 0) raw = raw.slice(2);
    if (!raw) return '';
    var padded = raw.replace(/-/g, '+').replace(/_/g, '/');
    while (padded.length % 4) padded += '=';
    try {
      var text = decodeURIComponent(escape(atob(padded)));
      /* 只接受 iCloud 的分享網址——這一頁不是一個誰都可以用的轉址器。 */
      return /^https:\/\/(www\.)?icloud\.com\//.test(text) ? text : '';
    } catch (err) {
      return '';
    }
  }

  var url = decode(location.hash);
  if (!url) {
    head.textContent = '這條邀請連結不完整';
    lede.textContent = '請對方重新複製一次連結——網址最後那一段（# 之後）也要一起帶上。';
    return;
  }
  go.href = url;
  go.hidden = false;
})();
</script>
