// App 字串（Scripts/i18n/maps）：UI.json tabTrip／tabFiles／tabTodos、sectionCount、durationMinutes／durationHours／
// durationHoursMinutes、runFieldSeparator、gap、noGap；Overview.json rowAllDay；Domain.json legMode*、bookendOpening／Closing
const S = {
  'zh-Hant-TW': { tabs: ['行程', '附件', '待辦清單'], count: n => `${n} 項`, allDay: '全日',
    min: m => `${m} 分`, hr: h => `${h} 小時`, hm: (h, m) => `${h} 小時 ${m} 分`, sep: '　',
    gap: x => `間隔 ${x}`, noGap: '無間隔', opening: '開始', closing: '結束',
    mode: { walking: '步行', driving: '開車', cycling: '騎車', transit: '大眾運輸', other: '其他' } },
  en: { tabs: ['Itinerary', 'Files', 'To-Dos'], count: n => `${n}`, allDay: 'All-day',
    min: m => `${m} min`, hr: h => `${h} h`, hm: (h, m) => `${h} h ${m} min`, sep: ' · ',
    gap: x => `${x} gap`, noGap: 'No gap', opening: 'opening', closing: 'closing',
    mode: { walking: 'Walking', driving: 'Driving', cycling: 'Cycling', transit: 'Transit', other: 'Other' } },
  ja: { tabs: ['日程', '添付', 'やることリスト'], count: n => `${n} 件`, allDay: '終日',
    min: m => `${m} 分`, hr: h => `${h} 時間`, hm: (h, m) => `${h} 時間 ${m} 分`, sep: '　',
    gap: x => `間隔 ${x}`, noGap: '間隔なし', opening: '最初', closing: '最後',
    mode: { walking: '徒歩', driving: '車', cycling: '自転車', transit: '公共交通', other: 'その他' } },
};
const s = S[lang] || S['zh-Hant-TW'];
const dur = m => m < 60 ? s.min(m) : (m % 60 ? s.hm(Math.floor(m / 60), m % 60) : s.hr(m / 60));

// 步行時間在 App 裡是 MKDirections 現算的（不是範本存的 durationMinutes）。基準圖上量到的數字記在這裡，
// key ＝ 下游那則的 key（收尾那一段用「上游 key:closing」）。
const ROUTED = { 'd1-okonomiyaki': 14, 'd1-ekie': 7, 'd1-ekie:closing': 12 };

// DesignIcon.swift：24 格線條
const LINE = {
  share: '<path d="M12 16V4M8 7.5l4-4 4 4M5 14v5q0 1 1 1h12q1 0 1-1v-5"/>',
  chevronDown: '<path d="M5 9l7 7 7-7"/>',
  chevronRight: '<path d="M9 5l7 7-7 7"/>',
  walking: '<circle cx="13" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M11.5 8.5 9 13l3 2 1 6M13.5 8.5l2 3.5 3 1M12 15l-3 6"/>',
  transit: '<rect x="6" y="4" width="12" height="12" rx="2"/><path d="M6 11h12M9.5 19.5 8 22M14.5 19.5 16 22"/>',
  ellipsis: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
};
const line = (n, w) => `<svg class="line" viewBox="0 0 24 24" style="stroke-width:${w};color:var(--muted)">${LINE[n]}</svg>`;
const maki = k => `<svg class="maki" viewBox="0 0 15 15"><path d="${MAKI[k] || ''}"/></svg>`;

const d = document.getElementById('d');
const trip = await loadTrip();
const todayNo = +(params.get('today') || 1);
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const nowMin = toMin(params.get('now') || '20:45');
const dateOf = n => new Date(start.getTime() + (n - 1) * 864e5);
const today = dateOf(todayNo);

d.insertAdjacentHTML('beforeend', `
  <div class="head"><div class="greet">${t.monthDay(today.getMonth() + 1, today.getDate())} · ${t.weekday[today.getDay()]}</div>
  <div class="title">${fmt(trip.title)}</div></div>
  <div class="head-act"><svg viewBox="0 0 24 24">${LINE.share}</svg></div>
  <div class="seg">${s.tabs.map((x, i) => `<div class="${i ? '' : 'on'}">${x}</div>`).join('')}</div>`);

// ── 一天的列（OverviewViewModel.overviewEvents：全日 → 開始書擋 → 定時 → 結束書擋） ──
const ZONE = { 'Asia/Taipei': 480, 'Asia/Tokyo': 540 };
const shift = z => z ? 540 - (ZONE[z] ?? 540) : 0;
const clock = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function legLabel(lg, gap, key) {
  const run = lg.runs && lg.runs[lg.selectedRunIndex || 0];
  if (run) return [run.name, run.departure, dur(toMin(run.arrival) - toMin(run.departure))].join(s.sep);
  const name = s.mode[lg.mode] || lg.mode;
  const tm = ROUTED[key] ?? lg.durationMinutes;
  const parts = [tm > 0 ? `${name} ${dur(tm)}` : name];
  if (gap != null) parts.push(gap > 0 ? s.gap(dur(gap)) : s.noGap);
  return parts.join(' · ');
}
function legIcon(lg) {
  if (lg.mode === 'transit' && lg.transitKind && MAKI[lg.transitKind]) return maki(lg.transitKind);
  return line({ walking: 'walking', transit: 'transit', other: 'ellipsis' }[lg.mode] || 'transit', 1.8);
}
const legRow = (lg, gap, key) => `<div class="leg">${legIcon(lg)}<span>${fmt(legLabel(lg, gap, key))}</span></div>`;
const eventRow = (lead, title, cat, done) =>
  `<div class="row${done ? ' done' : ''}"><div class="lead"${/\d/.test(lead) ? ' lang="en"' : ''}>${fmt(lead)}</div>
    <div class="name ${swatchClass(cat)}"><i></i><span>${fmt(title)}</span></div>${MAKI[cat] ? maki(cat) : ''}</div>`;

function dayRows(n) {
  const day = trip.days.find(x => x.day === n);
  const allDay = trip.allDayEvents.filter(a => a.fromDay <= n && n <= a.toDay);
  const timed = day.events.filter(e => e.start && e.end).map(e => ({
    ...e,
    s: toMin(e.start) + shift(e.startTimeZoneID || e.timeZoneID),
    e2: toMin(e.end) + shift(e.endTimeZoneID || e.timeZoneID),
  })).sort((a, b) => a.s - b.s);
  const isDone = end => n < todayNo || (n === todayNo && end <= nowMin);
  let html = '', count = 0;
  for (const a of allDay) { html += eventRow(s.allDay, a.title, a.category, n < todayNo); count++; }
  for (const a of allDay.filter(a => (a.openingDays || []).includes(n))) { html += eventRow(s.opening, a.title, a.category, n < todayNo); count++; }
  timed.forEach((e, i) => {
    const up = timed.find(x => x.key === e.leg?.fromKey) || timed[i - 1];
    if (e.leg?.mode) html += legRow(e.leg, up ? Math.max(0, e.s - up.e2) : null, e.key);
    html += eventRow(`${clock(e.s)} – ${clock(e.e2)}`, e.title, e.category, isDone(e.e2));
    count++;
  });
  const last = timed[timed.length - 1];
  for (const a of allDay.filter(a => (a.closingDays || []).includes(n))) {
    if (last?.closingLeg?.mode) html += legRow(last.closingLeg, 1440 - last.e2, `${last.key}:closing`);
    html += eventRow(s.closing, a.title, a.category, n < todayNo);
    count++;
  }
  return { html, count };
}

let table = '';
for (let n = todayNo; n <= trip.dayCount; n++) {
  const dt = dateOf(n), { html, count } = dayRows(n), open = n === todayNo;
  table += `<div class="hdr"><div class="tc"><b>${n === todayNo ? t.today : t.day(n)}</b>
    <span>${t.shortDate(dt.getMonth() + 1, dt.getDate())} ${t.weekday[dt.getDay()]}</span></div>
    <div class="tag">${s.count(count)}</div><div class="sp"></div>
    <svg viewBox="0 0 24 24">${open ? LINE.chevronDown : LINE.chevronRight}</svg></div>${open ? html : ''}`;
}
d.insertAdjacentHTML('beforeend', `<div class="table">${table}</div>`);

chrome(d, { tab: 0 });
ready();
</script>
