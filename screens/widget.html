<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>主畫面小工具</title>
<!--
  iPhone 主畫面，放兩支 TripEZGo widget：中尺寸「行程」（進行中那一種）＋小尺寸「匯率換算」。
  App：TripEZGoWidget/Views/AgendaCards.swift（live）、ExchangeCards.swift、WidgetPieces.swift、
  WidgetTheme.swift、WidgetPalette.swift；字串 Scripts/i18n/maps/TripEZGoWidget.json。
  參數：?lang=zh-Hant-TW|en|ja &day=2 &start=2026-10-10 &now=10:41
  主畫面本身（格線、圖示、Dock、搜尋膠囊）是系統 UI，照 iOS 26「大圖示、不顯示名稱」的樣子畫；
  其他 App 一律畫成沒有圖案的中性方塊。匯率金額是樣本。
-->
<link rel="stylesheet" href="screen.css">
<style>
  :root { --success-ink: var(--green200); --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  .device { background: #6aa6d8 url(img/share-wallpaper.jpg) center / cover no-repeat; }
  .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.12)); }

  /* Widget 外框：iPhone 17 Pro 小 170×170、中 364×170，圓角照系統；白卡＝containerBackground(tzCard) */
  .w { position: absolute; height: 170px; border-radius: 24px; background: var(--card); padding: 16px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 2px 14px rgba(0,30,60,.12); }
  .w.m { left: 19px; width: 364px; }
  .w.s { left: 19px; width: 170px; }

  /* WidgetHead：字標 16（圓角 4、字形 10）、間距 6、字 11 bold 大寫 字距 .06em、尾巴 11 等寬 字距 .04em、下距 10 */
  .wh { display: flex; align-items: center; gap: 6px; padding-bottom: 10px; }
  .mark { flex: none; width: 16px; height: 16px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; }
  .mark svg { width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .wh b { flex: 1 1 auto; min-width: 0; font: 700 11px/13px var(--font); letter-spacing: .66px; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wh span { flex: none; font: 400 11px/13px var(--mono); letter-spacing: .44px; color: var(--muted); }

  /* WidgetAnswer：點 7、名字 16 bold（中）、剩餘 12、上距 3 */
  .wa { display: flex; align-items: baseline; gap: 6px; }
  .wa i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--success); transform: translateY(-1px); }
  .wa b { font: 700 16px/20px var(--font); letter-spacing: .3px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wr { margin-top: 3px; font: 400 12px/15px var(--font); letter-spacing: .24px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wr b { color: var(--ink); }
  .hair { margin: 6px 0 3px; height: 1px; background: var(--border); }

  /* WidgetEventRow（中）：時刻欄 44、間距 8、上下 4、時刻 11 等寬、名稱 13、狀態 10 */
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .row + .row { border-top: 1px solid var(--border-soft); }
  .row .tm { flex: none; width: 44px; font: 400 11px/14px var(--mono); letter-spacing: .22px; color: var(--muted); }
  .row .nm { flex: 1 1 auto; min-width: 0; font: 400 13px/17px var(--font); letter-spacing: .26px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .st { flex: none; font: 400 10px/13px var(--font); letter-spacing: .6px; color: var(--muted); }

  /* WidgetExchangeHero（放不下一行就疊兩行）＋ WidgetFoot */
  .fx-a { font: 700 17px/21px var(--mono); color: var(--muted); white-space: nowrap; }
  .fx-r { display: flex; align-items: baseline; gap: 4px; }
  .fx-r i { font: 400 13px/16px var(--font); font-style: normal; color: var(--muted); }
  .fx-r b { font: 700 24px/29px var(--mono); letter-spacing: -.24px; color: var(--ink); white-space: nowrap; }
  .foot { margin-top: auto; font: 400 12px/15px var(--font); letter-spacing: .24px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 主畫面格線：四欄 64、欄距 42，左右 19；不顯示名稱 */
  .ic { position: absolute; width: 64px; height: 64px; border-radius: 15px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,30,60,.12); }
  .ic.blank { background: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.6), 0 2px 10px rgba(0,30,60,.08); }
  .ic img { width: 100%; height: 100%; display: block; }
  .dock { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 92px; border-radius: 34px;
    background: rgba(255,255,255,.24); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.45); }
  .find { position: absolute; left: 50%; bottom: 116px; transform: translateX(-50%); height: 30px; padding: 0 13px 0 11px;
    border-radius: 15px; display: flex; align-items: center; gap: 5px; color: #fff; font: 600 13px/16px var(--font);
    background: rgba(255,255,255,.22); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.4); }
  .find svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
</style>
</head>
<body>
<div class="device" id="d"><div class="dim"></div></div>
<script type="module">
import { fmt, lang, params, loadTrip, loadCategories, categoryName, chrome, toMin, duration, ready } from './chrome.js';

const d = document.getElementById('d');
const trip = await loadTrip();
await loadCategories();
const dayNo = +(params.get('day') || 2);
const now = params.get('now') || '10:41';
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const date = new Date(start.getTime() + (dayNo - 1) * 864e5);

// TripEZGoWidget.json（逐字）；dayMonth 是 "Md" 範本（三語都是 10/11）
const S = {
  'zh-Hant-TW': { live: '進行中', day: n => `第 ${n} 天`, remain: '還有 ', ends: x => ` · ${x} 結束`,
    fx: '匯率換算', tap: '點一下換算', find: '搜尋',
    sample: { amount: '¥1,580', result: '$332.12', rate: '¥100 ≈ $21.02' } },
  en: { live: 'Now', day: n => `Day ${n}`, remain: 'In ', ends: x => ` · ends ${x}`,
    fx: 'Currency', tap: 'Tap to convert', find: 'Search',
    sample: { amount: '¥1,580', result: '$10.57', rate: '¥100 ≈ $0.67' } },
  ja: { live: '進行中', day: n => `${n}日目`, remain: '残り ', ends: x => ` · ${x} 終了`,
    fx: '為替換算', tap: 'タップして換算', find: '検索',
    sample: { amount: '￥1,580', result: 'NT$332.12', rate: '￥100 ≈ NT$21.02' } },
}[lang];

// TripWidgetAgenda：現在那一則＋ remaining（下一則開始之後的每一站）的前兩站
const events = trip.days.find(x => x.day === dayNo).events.filter(e => e.start && e.end);
const nowMin = toMin(now);
const i = events.findIndex(e => toMin(e.start) <= nowMin && nowMin < toMin(e.end));
const cur = events[i], rest = events.slice(i + 1, i + 3);
const brand = '<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4v4.2a3.4 3.4 0 0 0 3.4 3.4h5.2"/>';
const head = (label, trailing) => `<div class="wh"><span class="mark"><svg viewBox="0 0 24 24">${brand}</svg></span>
  <b>${label}</b>${trailing ? `<span>${trailing}</span>` : ''}</div>`;

const md = `${date.getMonth() + 1}/${date.getDate()}`;
const TOP = 74, GAP = 34, PITCH = 106, ROW = 64 + 42;
d.insertAdjacentHTML('beforeend', `
  <div class="w m" style="top:${TOP}px">
    ${head(S.live, `${md} · ${S.day(dayNo)}`)}
    <div class="wa"><i></i><b>${fmt(cur.title)}</b></div>
    <div class="wr">${S.remain}<b>${duration(toMin(cur.end) - nowMin)}</b>${S.ends(cur.end)}</div>
    <div class="hair"></div>
    ${rest.map(e => `<div class="row"><span class="tm">${e.start}</span><span class="nm">${fmt(e.title)}</span>
      <span class="st">${categoryName(e.category)}</span></div>`).join('')}
  </div>
  <div class="w s" style="top:${TOP + 170 + GAP}px">
    ${head(S.fx)}
    <div class="fx-a">${S.sample.amount}</div>
    <div class="fx-r"><i>≈</i><b>${S.sample.result}</b></div>
    <div class="foot">${S.sample.rate} · ${S.tap}</div>
  </div>`);

// 圖示：小 widget 右邊 2×2、下面一整列；TripEZGo 自己用官網的 icon
const y2 = TOP + 170 + GAP, y3 = y2 + 170 + GAP;
const cols = [19, 125, 213, 319];
const slots = [[2, y2], [3, y2], [2, y2 + ROW], [3, y2 + ROW], [0, y3], [1, y3], [2, y3], [3, y3], [0, y3 + ROW], [1, y3 + ROW]];
d.insertAdjacentHTML('beforeend', slots.map(([c, y], k) => k === 4
  ? `<div class="ic" style="left:${cols[c]}px;top:${y}px"><img src="img/app-icon-180.png" alt=""></div>`
  : `<div class="ic blank" style="left:${cols[c]}px;top:${y}px"></div>`).join('')
  + `<div class="find"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>${S.find}</div>
  <div class="dock"></div>`
  + cols.map(x => `<div class="ic blank" style="left:${x}px;bottom:24px"></div>`).join(''));

chrome(d, { dark: true });
ready();
</script>
</body>
</html>
