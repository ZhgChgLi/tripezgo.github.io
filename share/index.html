<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>分享 TripEZGo，送你一年 Premium</title>
<meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1f1914" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/img/icon-180.png" />
<!-- 版面與六語文案是 ticket 07；這一版只是 tracer：登入 → 後端驗身分 → 顯示狀態。 -->
<style>
  :root { --paper: #fbf8f4; --card: #ffffff; --ink: #241d17; --machi: #2f918e; --taupe: #7c6f63; --line: #dbd5cd; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1f1914; --card: #2a231d; --ink: #f3ede6; --taupe: #b3a597; --line: #4a4037; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 20px; }
  .muted { color: var(--taupe); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <h1>分享 TripEZGo，送你一年 Premium</h1>
  <p class="muted">在社群貼出 TripEZGo 的畫面，上傳那篇貼文的截圖，通過就送你一組兌換碼。</p>

  <section class="card" data-view="signed-out">
    <p>先用 Google 帳號登入。</p>
    <div id="signin"></div>
  </section>

  <section class="card" data-view="loading" hidden>
    <p class="muted">確認中…</p>
  </section>

  <section class="card" data-view="ready" hidden>
    <p>登入成功。你還可以上傳 <strong id="remaining"></strong> 次。</p>
  </section>

  <section class="card" data-view="error" hidden>
    <p>出了點問題，請稍後再試。</p>
  </section>
</main>
</body>
</html>
